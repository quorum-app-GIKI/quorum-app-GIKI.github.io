<!-- The phone page for check-ins through the hub. One self-contained file: it can be served by the instructor's computer or by any static web host.
     Everything it needs is after the # in the address (hub address, public key, lecture, code); a phone never sends that part to a web server.
     Its look is the app's own student page (the style rules below are copied from the app's stylesheet; tests/test_z13_hubpage.py checks they still match). -->

body{display:flex;justify-content:center;padding:18px 14px calc(30px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:440px}
.hd{margin:6px 2px 14px} .hd .k{font-size:.8rem;font-weight:700;color:color-mix(in srgb,var(--accent) 78%,var(--ink));text-transform:uppercase;letter-spacing:.06em}

.ic.Present,.ic.Late{background:var(--green-bg);color:var(--green)} .ic.Absent{background:var(--red-bg);color:var(--red)} .ic.Flagged,.ic.info{background:var(--amber-bg);color:var(--amber)}
.priv{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center}
[hidden]{display:none!important}

/* ======================================================================================================================================================
   GLASS: the starting look (Settings > Colors > Style; "Classic" keeps the earlier solid panels). Frosted, see-through panels over a soft glowing background.
   Only the variables and a few large surfaces change, so every screen follows. Blur is used on large surfaces only (page background, navigation bar,
   cards, dialogs, pop-ups), never on table rows, so older computers stay smooth. The lecture QR stays on a solid white tile.
   ====================================================================================================================================================== */
html[data-style="glass"]{
  --glass-line:rgba(255,255,255,.17); --glass-hi:rgba(255,255,255,.32); --glass-lo:rgba(255,255,255,.06);
  --glass-sh:0 14px 44px rgba(0,0,0,.38); --blur:22px; --bo:1.1; --muted:color-mix(in srgb,var(--ink) 80%,var(--bg));
  --card:color-mix(in srgb,var(--card-s) 52%,transparent);
  --soft:color-mix(in srgb,var(--soft-s) 55%,transparent);
  --input-bg:color-mix(in srgb,var(--bg) 42%,transparent);
  --line:rgba(255,255,255,.13); --shadow:0 10px 34px rgba(0,0,0,.3);
}
html[data-style="glass"][data-mode="light"]{
  --glass-line:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,1); --glass-lo:rgba(60,80,120,.06);
  --glass-sh:0 12px 38px rgba(31,50,90,.14); --bo:.8;
  --card:color-mix(in srgb,#fff 58%,transparent);
  --soft:color-mix(in srgb,var(--soft-s) 62%,transparent);
  --input-bg:rgba(255,255,255,.62);
  --line:rgba(40,62,98,.15); --shadow:0 8px 28px rgba(31,50,90,.1);
}
html[data-style="glass"] body{background:var(--bg)}
html[data-style="glass"] body::before{content:"";position:fixed;inset:-12vmax;z-index:-1;pointer-events:none;will-change:transform;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 8px),
    radial-gradient(40vmax 40vmax at 14% 10%,rgb(var(--g1) / calc(.50 * var(--bo))),transparent 68%),
    radial-gradient(36vmax 36vmax at 86% 16%,rgb(var(--g2) / calc(.40 * var(--bo))),transparent 68%),
    radial-gradient(44vmax 44vmax at 72% 96%,rgb(var(--g1) / calc(.28 * var(--bo))),transparent 68%),
    radial-gradient(32vmax 32vmax at 4% 88%,rgb(var(--g2) / calc(.26 * var(--bo))),transparent 68%);
  animation:glassDrift 46s ease-in-out infinite alternate}
@keyframes glassDrift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2.5vmax,2vmax,0) scale(1.07)}}
html[data-style="glass"][data-calm] body::before,html[data-style="glass"] body.present::before{animation:none}
@media (prefers-reduced-motion:reduce){html[data-style="glass"] body::before{animation:none}}

/* panels */
html[data-style="glass"] .card{background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%),var(--card);border:1px solid var(--glass-line);border-radius:22px;
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);backdrop-filter:blur(var(--blur)) saturate(1.5);box-shadow:inset 1px 1px 0 var(--glass-hi),inset -1px -1px 0 var(--glass-lo),var(--glass-sh)}
html[data-style="glass"] .card .card{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.04);box-shadow:inset 1px 1px 0 var(--glass-hi)}
html[data-style="glass"] .table-wrap{background:var(--card);border-color:var(--glass-line);border-radius:18px;box-shadow:inset 1px 1px 0 var(--glass-hi)}
html[data-style="glass"] th{background:color-mix(in srgb,var(--soft-s) 90%,transparent)}
html[data-style="glass"] .nav{background:color-mix(in srgb,var(--card-s) 72%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  border-bottom:1px solid var(--glass-line);box-shadow:inset 0 -1px 0 var(--glass-lo),0 8px 30px rgba(0,0,0,.16)}
html[data-style="glass"] .nav a.l{border-radius:99px}
html[data-style="glass"] .nav a.l.on{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--accent-soft);box-shadow:inset 1px 1px 0 var(--glass-hi),0 0 18px rgba(var(--acc-rgb),.28)}
html[data-style="glass"] .brand i{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.85),transparent 42%),linear-gradient(135deg,var(--brand-a),var(--brand-b));box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 16px rgba(var(--acc-rgb),.5)}

/* buttons, fields */
html[data-style="glass"] .btn{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03)),var(--card);border:1px solid var(--glass-line);border-radius:12px;box-shadow:inset 0 1px 0 var(--glass-hi)}
html[data-style="glass"] .btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07)),var(--card);border-color:var(--accent-line)}
html[data-style="glass"] .btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%),var(--accent);border-color:rgba(255,255,255,.4);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 22px rgba(var(--acc-rgb),.35)}
html[data-style="glass"] .btn.primary:hover{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 58%),var(--accent)}
html[data-style="glass"] input:not([type=checkbox]):not([type=radio]),html[data-style="glass"] select,html[data-style="glass"] textarea{background:var(--input-bg);border:1px solid var(--glass-line);border-radius:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}
html[data-style="glass"] option{background:var(--card-s);color:var(--ink)}
html[data-style="glass"] .modebtn{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03)),var(--card);border-color:var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
html[data-style="glass"] .uiswitch,html[data-style="glass"] .seg,html[data-style="glass"] .tabs{border-radius:99px}
html[data-style="glass"] h1{font-weight:650;letter-spacing:-.02em}

/* dense glass for things that float above the page (always readable) */
html[data-style="glass"] dialog,html[data-style="glass"] .hp-pop,html[data-style="glass"] .nf-panel,html[data-style="glass"] .nf-toast,html[data-style="glass"] .mt-toast,html[data-style="glass"] .mt-fetch-card{
  background:color-mix(in srgb,var(--card-s) 84%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--glass-line);color:var(--ink)}
html[data-style="glass"] dialog{border-radius:24px;box-shadow:inset 1px 1px 0 var(--glass-hi),0 30px 80px rgba(0,0,0,.5)}
html[data-style="glass"] .hp-pop:before{background:var(--card-s)}
html[data-style="glass"] dialog::backdrop{background:rgba(2,6,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* Settings: the four levels become tinted glass, each a different shade of the chosen color */
html[data-style="glass"] .setnav{background:transparent;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-style="glass"] .tabs1{background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid var(--glass-line);border-radius:20px;box-shadow:inset 1px 1px 0 var(--glass-hi)}
html[data-style="glass"] .t1:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
html[data-style="glass"] .t1.on{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 58%),var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 16px rgba(var(--acc-rgb),.35)}
html[data-style="glass"] .t2{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--glass-line)}
html[data-style="glass"] .t2.on{background:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:inset 0 -3px 0 var(--accent),0 0 14px rgba(var(--acc-rgb),.2)}
html[data-style="glass"] .sec{background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid var(--glass-line);border-left:3px solid var(--accent-line);border-radius:16px;box-shadow:inset 1px 1px 0 var(--glass-hi)}
html[data-style="glass"] .sec.l4{background:color-mix(in srgb,var(--accent) 4%,transparent);border-radius:13px;box-shadow:none}
html[data-style="glass"] .sec>h2:hover,html[data-style="glass"] .sec>h3:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
html[data-style="glass"] .sec .card{background:color-mix(in srgb,var(--accent) 3%,transparent);box-shadow:none}

/* light glass: dark accents with white text, so the shine on primary buttons and the selected tab stays gentle (the text must keep its contrast) */
html[data-style="glass"][data-mode="light"] .btn.primary,html[data-style="glass"][data-mode="light"] .t1.on{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%),var(--accent)}
html[data-style="glass"][data-mode="light"] .btn.primary:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 55%),var(--accent)}

/* the lecture QR stays crisp on a solid white tile */
html[data-style="glass"] .qrbox{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-radius:24px;box-shadow:0 0 0 8px rgba(255,255,255,.14),0 20px 60px rgba(0,0,0,.35)}
html[data-style="glass"] body.present .card{-webkit-backdrop-filter:none;backdrop-filter:none}

/* browsers without blur, and people who ask for more contrast, get denser panels */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  html[data-style="glass"]{--card:color-mix(in srgb,var(--card-s) 94%,transparent);--soft:color-mix(in srgb,var(--soft-s) 94%,transparent)}
  html[data-style="glass"][data-mode="light"]{--card:color-mix(in srgb,#fff 94%,transparent)}
  html[data-style="glass"] .nav{background:var(--card-s)}
}
@media (prefers-contrast:more){
  html[data-style="glass"]{--card:color-mix(in srgb,var(--card-s) 94%,transparent);--soft:color-mix(in srgb,var(--soft-s) 94%,transparent);--line:rgba(255,255,255,.3)}
  html[data-style="glass"][data-mode="light"]{--card:#fff;--line:rgba(40,62,98,.4)}
}

body{display:flex;justify-content:center;padding:18px 14px calc(30px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:440px}

</style><script>
/* the look: the instructor's colour (c), light or dark (m) and style (s) arrive after the # in the address, with the lecture, so this page matches their screens */
(function () { var q = new URLSearchParams(location.hash.slice(1)), h = document.documentElement, c = q.get('c') || '', m = q.get('m') || '', st = q.get('s') || '';
  if (/^[a-z]{3,12}$/.test(c) && c !== 'sky') h.setAttribute('data-theme', c);
  h.setAttribute('data-mode', m === 'light' ? 'light' : 'dark'); h.setAttribute('data-style', st === 'classic' ? 'classic' : 'glass'); })();
</script></head><body><div class="wrap">
<div class="hd"><div class="k" id="course"></div><h1 id="title">Mark attendance</h1><div class="muted small" id="sub"></div></div>
<div class="card result" id="state"><div class="ic info">…</div><h2>One moment…</h2></div>
<div class="card stack" id="form" hidden>
  <div><label for="reg">Registration number</label><input id="reg" autocomplete="off" autocapitalize="characters" placeholder="Your registration / roll number" maxlength="20"></div>
  <div id="extra" hidden class="stack"><div class="alert">If your number is not in the class list, fill in your details so your instructor can check it.</div>
    <div><label>Full name</label><input id="nm" autocomplete="name"></div><div><label>Program</label><input id="pr" placeholder="e.g. BDS"></div></div>
  <button class="btn primary lg" id="go" style="width:100%;justify-content:center" disabled>Submit attendance</button>
  <div class="small" id="err" style="color:var(--red);text-align:center"></div>
  <a href="#" id="more" class="muted small" style="display:block;text-align:center">My number is not accepted</a>
</div>
<div class="card result" id="res" hidden><div class="ic Present">✓</div><h2>Received</h2><p id="rmsg" class="muted" style="margin:0"></p></div>
<div class="priv" id="priv"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.hash.slice(1));
const HUB = (P.get('u') || '').replace(/\/+$/, ''), KEY = P.get('k') || '', LEC = P.get('l') || '', TOK = P.get('t') || '';
let DEV = ''; try { DEV = localStorage.getItem('dev') || ''; } catch (e) {}
if (!DEV) { DEV = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x => x.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('dev', DEV); } catch (e) {} }
let TICKET = '', NEED_LOC = false, best = null, watch = null, finished = true, locStart = Date.now(), fpv = '';
function show(icon, title, text, cls) { $('state').hidden = false; $('state').innerHTML = '<div class="ic ' + (cls || 'info') + '">' + icon + '</div><h2></h2><p class="muted" style="margin:0"></p>'; $('state').querySelector('h2').textContent = title; $('state').querySelector('p').textContent = text || ''; }
async function rpc(name, body) {
  let last;
  for (let i = 0; i < 3; i++) {                                    // a weak or switching mobile connection often fails the first try
    try {
      const r = await fetch(HUB + '/rest/v1/rpc/' + name, {method: 'POST', headers: {'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      const j = await r.json(); if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status)); return j;
    } catch (e) { last = e; $('err').textContent = 'Connection is weak, trying again…'; await new Promise(res => setTimeout(res, 1200 * (i + 1))); }
  }
  throw last;
}
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return ''; } }
(async () => { let c = ''; try { const cv = document.createElement('canvas'); cv.width = 120; cv.height = 30; const x = cv.getContext('2d'); x.font = '16px Arial'; x.fillText('attend-é✓', 4, 20); c = cv.toDataURL().slice(-60); } catch (e) {}
  fpv = await sha([navigator.userAgent, navigator.platform, screen.width, screen.height, devicePixelRatio, Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, navigator.hardwareConcurrency, navigator.deviceMemory, c].join('|')); })();
function startLoc() {
  if (!NEED_LOC) return;
  if (!navigator.geolocation) return;
  finished = false; locStart = Date.now();
  const stop = () => { if (watch != null) navigator.geolocation.clearWatch(watch); watch = null; finished = true; };
  setTimeout(stop, 22000);                                         // a rough fix comes first on mobile data; keep listening for a sharper one
  watch = navigator.geolocation.watchPosition(p => { const c = p.coords; if (!best || c.accuracy < best.acc) best = {lat: c.latitude, lng: c.longitude, acc: c.accuracy, ts: p.timestamp}; if (best.acc <= 20) setTimeout(stop, 600); },
    e => { if (!best) finished = true; }, {enableHighAccuracy: true, timeout: 22000, maximumAge: 0});
}
async function waitLoc() { while (NEED_LOC && !finished && Date.now() - locStart < 23000) await new Promise(r => setTimeout(r, 200)); }
async function start() {
  if (!/^https:\/\//.test(HUB) && !/^http:\/\/(localhost|127\.0\.0\.1)/.test(HUB) || !KEY || !LEC || !TOK) { show('!', 'Link not recognised', 'Scan the QR code shown by your instructor.', 'Absent'); return; }
  let j;
  try { j = await rpc('qr_ticket', {p_lecture: LEC, p_token: TOK, p_dev: DEV}); }
  catch (e) { show('!', 'No connection', 'Check your internet (mobile data or Wi-Fi), then scan the QR code again.', 'Absent'); return; }
  if (!j.ok) { show(j.code === 'closed' ? '⏱' : '↻', j.code === 'closed' ? 'Attendance is not open' : 'That code has changed', j.message); return; }
  TICKET = j.ticket; NEED_LOC = !!j.need_loc;
  if (j.label) {                                                   // 'course|Lecture n|date · hall' (older rows: one text)
    const p = String(j.label).split('|');
    if (p.length >= 3) { $('course').textContent = p[0]; $('title').textContent = p[1] || 'Mark attendance'; $('sub').textContent = p[2]; }
    else { $('course').textContent = j.label; }
  }
  $('state').hidden = true; $('form').hidden = false;
  $('priv').textContent = 'One check-in per phone. ' + (NEED_LOC ? "To verify attendance, your phone's location and device are saved with this lecture's record." : "To verify attendance, your device is saved with this lecture's record.");
  startLoc(); $('reg').focus();
}
const reg = $('reg'), go = $('go');
reg.oninput = () => { reg.value = reg.value.replace(/[^0-9A-Za-z\- ]/g, '').toUpperCase(); go.disabled = reg.value.replace(/[^0-9A-Za-z]/g, '').length < 3; $('err').textContent = ''; };
$('more').onclick = e => { e.preventDefault(); $('extra').hidden = false; $('more').hidden = true; };
async function submit() {
  go.disabled = true; $('err').textContent = ''; go.textContent = 'Submitting…'; await waitLoc();
  const data = {name: $('nm').value, program: $('pr').value, dev_ls: DEV, fp: fpv, ua: navigator.userAgent.slice(0, 200)};
  if (best) Object.assign(data, {lat: best.lat, lng: best.lng, acc: best.acc, loc_ts: best.ts});
  try {
    const j = await rpc('qr_submit', {p_lecture: LEC, p_token: '', p_reg: reg.value.replace(/\s+/g, ''), p_dev: DEV, p_data: data, p_ticket: TICKET});
    if (!j.ok) { $('err').textContent = j.message; go.disabled = j.code === 'bad_reg' ? false : true; go.textContent = 'Submit attendance'; if (j.code === 'bad_ticket') { $('form').hidden = true; show('↻', 'This page has expired', j.message); } return; }
    $('form').hidden = true; $('res').hidden = false; $('rmsg').textContent = j.message;
  } catch (e) { $('err').textContent = 'No connection. Check your internet (mobile data or Wi-Fi) and press Submit again.'; go.disabled = false; go.textContent = 'Submit attendance'; }
}
go.onclick = submit; reg.onkeydown = e => { if (e.key === 'Enter' && !go.disabled) submit(); };
start();
</script></body></html>
